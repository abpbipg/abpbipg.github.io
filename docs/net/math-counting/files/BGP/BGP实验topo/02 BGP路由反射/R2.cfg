
[V200R003C00]
#
 sysname R2
#
 board add 0/4 1GEC 
#
 snmp-agent local-engineid 800007DB03000000000000
 snmp-agent 
#
 clock timezone China-Standard-Time minus 08:00:00
#
portal local-server load portalpage.zip
#
 drop illegal-mac alarm
#
 set cpu-usage threshold 80 restore 75
#
acl number 2000  
 rule 5 permit 
#
aaa 
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default 
 domain default_admin 
 local-user admin password cipher %$%$K8m.Nt84DZ}e#<0`8bmE3Uw}%$%$
 local-user admin service-type http
#
firewall zone Local
 priority 15
#
interface GigabitEthernet0/0/0
 ip address 10.0.24.2 255.255.255.0 
#
interface GigabitEthernet0/0/1
 ip address 10.0.23.2 255.255.255.0 
#
interface GigabitEthernet0/0/2
 ip address 10.0.12.2 255.255.255.0 
#
interface GigabitEthernet4/0/0
#
interface NULL0
#
interface LoopBack0
 ip address 10.0.2.2 255.255.255.255 
#
interface LoopBack1
 ip address 10.2.2.2 255.255.255.0 
#
bgp 64511
 router-id 10.0.2.2
 peer 10.0.12.1 as-number 64511 
 peer 10.0.23.3 as-number 64511 
 peer 10.0.24.4 as-number 64511 
 #
 ipv4-family unicast
  undo synchronization
  network 10.2.2.0 255.255.255.0 
  peer 10.0.12.1 enable
  peer 10.0.12.1 reflect-client
  peer 10.0.23.3 enable
  peer 10.0.24.4 enable
  peer 10.0.24.4 route-policy bgp export
#
ospf 1 router-id 10.0.2.2 
 area 0.0.0.0 
  network 10.0.2.2 0.0.0.0 
  network 10.0.12.2 0.0.0.0 
  network 10.0.23.2 0.0.0.0 
  network 10.0.24.2 0.0.0.0 
#
route-policy bgp deny node 10 
 if-match acl 2000 
#
user-interface con 0
 authentication-mode password
user-interface vty 0 4
user-interface vty 16 20
#
wlan ac
